<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>천체 크기 비교</title>
<style>
  body { margin: 0; overflow: hidden; background: #050510; overscroll-behavior: none; font-family: sans-serif; color: white; }
  canvas { display: block; outline: none; }
  #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .label { position: absolute; transform: translate(-50%, -100%); margin-top: -15px; background: rgba(0,0,0,0.6); padding: 6px 10px; border-radius: 6px; font-size: 13px; pointer-events: auto; cursor: pointer; white-space: nowrap; border: 1px solid rgba(255,255,255,0.2); transition: background 0.2s; }
  .label:hover { background: rgba(40,80,200,0.8); }
  .label .name { font-weight: bold; margin-bottom: 3px; }
  .label .size { font-size: 11px; color: #aaa; }
  
  #info-panel { position: absolute; right: -320px; top: 20px; width: 260px; background: rgba(20, 25, 40, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 12px; padding: 20px; border: 1px solid rgba(255,255,255,0.15); transition: right 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); pointer-events: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  #info-panel.show { right: 20px; }
  .close-btn { position: absolute; top: 15px; right: 15px; cursor: pointer; font-size: 20px; color: #888; transition: color 0.2s; }
  .close-btn:hover { color: white; }
  h2 { margin: 0 0 5px 0; font-size: 22px; color: #fff; }
  p { margin: 0 0 15px 0; font-size: 14px; color: #4dabf7; font-weight: bold; }
  
  .compare-box { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 8px; margin-top: 15px; border: 1px solid rgba(255,255,255,0.05); }
  .compare-title { font-size: 13px; color: #bbb; margin-bottom: 8px; }
  select { width: 100%; padding: 10px; border-radius: 6px; background: #1a1f35; color: white; border: 1px solid #444; outline: none; font-size: 14px; cursor: pointer; }
  select:focus { border-color: #4dabf7; }
  
  #fullscreenBtn { position: fixed; bottom: 20px; right: 20px; z-index: 9999; background: rgba(10, 15, 30, 0.8); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; width: 48px; height: 48px; cursor: pointer; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); pointer-events: auto; transition: background 0.2s; }
  #fullscreenBtn:hover { background: rgba(30, 40, 60, 0.9); }
</style>
</head>
<body>

<div id="ui-layer"></div>

<div id="info-panel">
  <div class="close-btn" id="closeBtn">✕</div>
  <h2 id="p-name">이름</h2>
  <p id="p-size">0 km</p>
  <div class="compare-box">
    <div class="compare-title">🪐 다른 천체와 크기 비교하기</div>
    <select id="compareSelect">
      <option value="">-- 천체 선택 --</option>
    </select>
  </div>
</div>

<button id="fullscreenBtn">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
  </svg>
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
const data = [
  { id: 'charon', name: '카론 (Charon)', d: 1207, color: 0x888888 },
  { id: 'pluto', name: '플루토 (Pluto)', d: 2306, color: 0xddbb99 },
  { id: 'eris', name: '에리스 (Eris)', d: 2400, color: 0xcccccc },
  { id: 'moon', name: '달 (Moon)', d: 3476, color: 0xaaaaaa },
  { id: 'mercury', name: '수성 (Mercury)', d: 4879, color: 0x999999 },
  { id: 'titan', name: '타이탄 (Titan)', d: 5150, color: 0xd6b075 },
  { id: 'ganymede', name: '가니메데 (Ganymede)', d: 5262, color: 0xb5a797 },
  { id: 'mars', name: '화성 (Mars)', d: 6805, color: 0xc1440e },
  { id: 'venus', name: '금성 (Venus)', d: 12104, color: 0xe6e6fa },
  { id: 'earth', name: '지구 (Earth)', d: 12756, color: 0x2b82c9 },
  { id: 'neptune', name: '해왕성 (Neptune)', d: 49528, color: 0x274687 },
  { id: 'uranus', name: '천왕성 (Uranus)', d: 51118, color: 0x4b70dd },
  { id: 'saturn', name: '토성 (Saturn)', d: 120536, color: 0xead6b8 },
  { id: 'jupiter', name: '목성 (Jupiter)', d: 142984, color: 0xc88b3a },
  { id: 'sun', name: '태양 (Sun)', d: 1392000, color: 0xffcc33, isStar: true },
  { id: 'sirius', name: '시리우스 (Sirius)', d: 1392000 * 1.8, color: 0xaaccff, isStar: true },
  { id: 'bluegiant', name: '청색 거성', d: 1392000 * 70, color: 0x4488ff, isStar: true },
  { id: 'redgiant', name: '적색 거성', d: 1392000 * 250, color: 0xff4422, isStar: true },
  { id: 'redsuper', name: '적색 초거성', d: 1392000 * 1000, color: 0xff2200, isStar: true }
];

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000000000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxDistance = 1500000000;

const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(1, 0.5, 1);
scene.add(dirLight);

const uiLayer = document.getElementById('ui-layer');
const select = document.getElementById('compareSelect');
const meshes = [];
const labels = [];
let activeObj = null;
let originalPositions = {};

const SCALE = 1000; 
let currentX = 0;

data.forEach((obj, i) => {
  const radius = (obj.d / 2) / SCALE;
  const geom = new THREE.SphereGeometry(radius, 64, 64);
  
  let mat;
  if(obj.isStar) {
    mat = new THREE.MeshBasicMaterial({ color: obj.color });
  } else {
    mat = new THREE.MeshLambertMaterial({ color: obj.color });
  }
  
  const mesh = new THREE.Mesh(geom, mat);
  
  if(i === 0) currentX = radius;
  else currentX += radius * 1.5;
  
  mesh.position.set(currentX, radius, 0);
  currentX += radius * 1.5;
  
  if(obj.id === 'saturn') {
    const ringGeom = new THREE.RingGeometry(radius * 1.2, radius * 2.2, 64);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xcca677, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
    const ring = new THREE.Mesh(ringGeom, ringMat);
    ring.rotation.x = Math.PI / 2 + 0.2;
    mesh.add(ring);
  }

  mesh.userData = { id: obj.id, name: obj.name, d: obj.d, radius: radius };
  originalPositions[obj.id] = mesh.position.clone();
  scene.add(mesh);
  meshes.push(mesh);
  
  const label = document.createElement('div');
  label.className = 'label';
  label.innerHTML = `<div class="name">${obj.name}</div><div class="size">${obj.d.toLocaleString()} km</div>`;
  label.onclick = (e) => { e.stopPropagation(); focusOn(mesh); };
  uiLayer.appendChild(label);
  labels.push({ element: label, mesh: mesh });
  
  const opt = document.createElement('option');
  opt.value = obj.id;
  opt.textContent = obj.name;
  select.appendChild(opt);
});

camera.position.set(originalPositions['earth'].x, originalPositions['earth'].y * 2, originalPositions['earth'].z + 50);
controls.target.copy(originalPositions['earth']);

function focusOn(mesh) {
  activeObj = mesh;
  const r = mesh.userData.radius;
  const pos = mesh.position;
  
  controls.target.copy(pos);
  const dist = r * 4;
  camera.position.set(pos.x, pos.y + r*0.5, pos.z + dist);
  
  document.getElementById('p-name').textContent = mesh.userData.name;
  document.getElementById('p-size').textContent = `직경: ${mesh.userData.d.toLocaleString()} km`;
  document.getElementById('info-panel').classList.add('show');
  
  select.value = "";
  restorePositions();
}

function restorePositions() {
  meshes.forEach(m => {
    m.position.copy(originalPositions[m.userData.id]);
    m.visible = true;
  });
}

select.addEventListener('change', (e) => {
  if(!activeObj) return;
  const targetId = e.target.value;
  restorePositions();
  
  if(targetId) {
    const compareMesh = meshes.find(m => m.userData.id === targetId);
    if(compareMesh && compareMesh !== activeObj) {
      meshes.forEach(m => { if(m !== activeObj && m !== compareMesh) m.visible = false; });
      const r1 = activeObj.userData.radius;
      const r2 = compareMesh.userData.radius;
      activeObj.position.set(-r1 * 1.1, Math.max(r1, r2), 0);
      compareMesh.position.set(r2 * 1.1, Math.max(r1, r2), 0);
      
      const center = new THREE.Vector3(0, Math.max(r1, r2), 0);
      controls.target.copy(center);
      const maxR = Math.max(r1, r2);
      camera.position.set(0, maxR, maxR * 4 + (r1+r2));
    }
  } else {
    focusOn(activeObj);
  }
});

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let dragStart = { x: 0, y: 0 };

window.addEventListener('pointerdown', (e) => { dragStart = { x: e.clientX, y: e.clientY }; });
window.addEventListener('pointerup', (e) => {
  if (Math.abs(e.clientX - dragStart.x) < 5 && Math.abs(e.clientY - dragStart.y) < 5) {
    if(e.target.closest('#info-panel') || e.target.closest('#fullscreenBtn') || e.target.closest('.label')) return;
    
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(meshes);
    
    if (intersects.length > 0) {
      focusOn(intersects[0].object);
    } else {
      document.getElementById('info-panel').classList.remove('show');
      restorePositions();
      select.value = "";
    }
  }
});

document.getElementById('closeBtn').addEventListener('click', () => {
  document.getElementById('info-panel').classList.remove('show');
  restorePositions();
  select.value = "";
});

document.getElementById('fullscreenBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(err => console.log(err));
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
  }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  
  labels.forEach(l => {
    if(!l.mesh.visible) {
      l.element.style.display = 'none';
      return;
    }
    const pos = l.mesh.position.clone();
    pos.y += l.mesh.userData.radius;
    pos.project(camera);
    
    if (pos.z > 1 || pos.x < -1 || pos.x > 1 || pos.y < -1 || pos.y > 1) {
      l.element.style.display = 'none';
    } else {
      l.element.style.display = 'block';
      const x = (pos.x * .5 + .5) * window.innerWidth;
      const y = (pos.y * -.5 + .5) * window.innerHeight;
      l.element.style.left = `${x}px`;
      l.element.style.top = `${y}px`;
    }
  });
  
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
