        }

            margin: 0;

            height: 100dvh;

            height: 100%;
            position: absolute;

            left: 0;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            z-index: 10;
            pointer-events: none;
        }
        .interactive {
            pointer-events: auto;
        }

            display: none;
        }

            -ms-overflow-style: none;
            scrollbar-width: none;

        }

        function createPlanetTexture(type) {
            const canvas = document.createElement('canvas');
            // Optimized texture resolution for mid-range mobile GPUs (Galaxy Tab S6 Lite)
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            // Helper for pseudo-random noise bands and craters
            function drawBands(colors, turbulence = 8) {
                const grad = ctx.createLinearGradient(0, 0, 0, h);
                colors.forEach((c, idx) => {
                    grad.addColorStop(idx / (colors.length - 1), c);
                });
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                // Subtle horizontal atmospheric streaks
                for (let i = 0; i < 180; i++) {
                    const y = Math.random() * h;
                    const bandH = 1 + Math.random() * turbulence;
                    ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)';
                    ctx.fillRect(0, y, w, bandH);
                }
            }

            function drawCraters(count, lightColor, darkColor) {
                for (let i = 0; i < count; i++) {
                    const x = Math.random() * w;
                    const y = 30 + Math.random() * (h - 60);
                    const r = 2 + Math.random() * 24;
                    ctx.beginPath();
                    ctx.arc(x, y, r, 0, Math.PI * 2);
                    ctx.fillStyle = darkColor;
                    ctx.fill();
                    ctx.lineWidth = 1.5;
                    ctx.strokeStyle = lightColor;
                    ctx.stroke();
                }
            }

            if (type === 'saturn') {
                // Smooth golden ochre bands like 12tune reference image
                drawBands([
                    '#c79557', '#d8a868', '#e6be81', '#efd199', '#d9ad6f',
                    '#c6985e', '#b58b59', '#d8ae72', '#e8c488', '#c29258'
                ], 5);
            } else if (type === 'jupiter') {
                // Detailed Jupiter zones, belts & Great Red Spot
                drawBands([
                    '#8c7865', '#c8b197', '#b58463', '#ece2d0', '#c48359',
                    '#e5d9c5', '#9e6242', '#f3ead8', '#c79c77', '#a68971', '#776758'
                ], 10);
                // Great Red Spot
                ctx.save();
                ctx.translate(w * 0.62, h * 0.64);
                ctx.scale(1.8, 1.0);
                const spotGrad = ctx.createRadialGradient(0, 0, 4, 0, 0, 34);
                spotGrad.addColorStop(0, '#e25b38');
                spotGrad.addColorStop(0.6, '#c84325');
                spotGrad.addColorStop(1, 'rgba(180, 90, 60, 0)');
                ctx.fillStyle = spotGrad;
                ctx.beginPath();
                ctx.arc(0, 0, 34, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            } else if (type === 'earth') {
                // Deep ocean base
                ctx.fillStyle = '#1d4ed8';
                ctx.fillRect(0, 0, w, h);
                // Continents
                ctx.fillStyle = '#15803d';
                for (let i = 0; i < 45; i++) {
                    ctx.beginPath();
                    ctx.arc(Math.random() * w, 50 + Math.random() * (h - 100), 25 + Math.random() * 65, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = '#ca8a04';
                for (let i = 0; i < 20; i++) {
                    ctx.beginPath();
                    ctx.arc(Math.random() * w, 80 + Math.random() * (h - 160), 15 + Math.random() * 35, 0, Math.PI * 2);
                    ctx.fill();
                }
                // Polar ice caps
                ctx.fillStyle = '#f8fafc';
                ctx.fillRect(0, 0, w, 36);
                ctx.fillRect(0, h - 36, w, 36);
                // Wispy white clouds
                ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
                for (let i = 0; i < 95; i++) {
                    ctx.fillRect(Math.random() * w, Math.random() * h, 40 + Math.random() * 140, 4 + Math.random() * 14);
                }
            } else if (type === 'mars') {
                drawBands(['#9a3412', '#c2410c', '#ea580c', '#b45309', '#9a3412'], 16);
                drawCraters(90, 'rgba(255,200,150,0.2)', 'rgba(80,20,5,0.35)');
                // Polar ice cap
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.fillRect(0, 0, w, 18);
                ctx.fillRect(0, h - 18, w, 18);
            } else if (type === 'venus') {
                drawBands(['#b4833e', '#d6a55c', '#edd08d', '#d19b52', '#a87638'], 14);
            } else if (type === 'uranus') {
                drawBands(['#67e8f9', '#a5f3fc', '#22d3ee', '#67e8f9'], 4);
            } else if (type === 'neptune') {
                drawBands(['#1e3a8a', '#2563eb', '#1d4ed8', '#3b82f6', '#172554'], 8);
            } else if (type === 'titan') {
                drawBands(['#ca8a04', '#eab308', '#facc15', '#ca8a04'], 6);
            } else if (type === 'pluto') {
                drawBands(['#a88b73', '#d6bfa7', '#bfa38a', '#8c725c'], 10);
                // Heart-shaped Tombaugh Regio
                ctx.fillStyle = 'rgba(250, 240, 230, 0.75)';
                ctx.beginPath();
                ctx.arc(w * 0.5, h * 0.5, 65, 0, Math.PI * 2);
                ctx.fill();
            } else if (type.startsWith('star_')) {
                const palettes = {
                    star_yellow: ['#fffbeb', '#fde047', '#f59e0b', '#d97706'],
                    star_white: ['#ffffff', '#e0f2fe', '#7dd3fc', '#38bdf8'],
                    star_blue: ['#e0f2fe', '#38bdf8', '#0284c7', '#0369a1'],
                    star_orange: ['#ffedd5', '#fb923c', '#ea580c', '#9a3412'],
                    star_red: ['#fee2e2', '#f87171', '#dc2626', '#7f1d1d']
                };
                const pal = palettes[type] || palettes.star_yellow;
                drawBands(pal, 14);
                // Solar granulation plasma cells
                for (let i = 0; i < 450; i++) {
                    ctx.fillStyle = i % 2 === 0 ? pal[0] : pal[3];
                    ctx.globalAlpha = 0.18;
                    ctx.beginPath();
                    ctx.arc(Math.random() * w, Math.random() * h, 4 + Math.random() * 24, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1.0;
            } else {
                // Moon, Mercury, Ganymede, Charon, Eris
                const baseColors = {
                    moon: ['#9ca3af', '#6b7280'],
                    mercury: ['#78716c', '#57534e'],
                    ganymede: ['#a8a29e', '#78716c'],
                    cratered_grey: ['#94a3b8', '#64748b'],
                    icy_white: ['#f1f5f9', '#cbd5e1']
                }[type] || ['#9ca3af', '#6b7280'];
                drawBands([baseColors[0], baseColors[1], baseColors[0]], 12);
                drawCraters(140, 'rgba(255,255,255,0.28)', 'rgba(0,0,0,0.28)');
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = 4;
            return tex;
        }

        function createSaturnRingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 512, 0);
            grad.addColorStop(0.0, 'rgba(255, 255, 255, 0.0)');
            grad.addColorStop(0.12, 'rgba(210, 190, 150, 0.15)');
            grad.addColorStop(0.25, 'rgba(235, 210, 165, 0.65)');
            grad.addColorStop(0.48, 'rgba(248, 228, 185, 0.88)');
            // Cassini Division gap
            grad.addColorStop(0.62, 'rgba(50, 40, 30, 0.08)');
            grad.addColorStop(0.66, 'rgba(50, 40, 30, 0.08)');
            grad.addColorStop(0.70, 'rgba(230, 208, 168, 0.75)');
            grad.addColorStop(0.92, 'rgba(215, 195, 155, 0.35)');
            grad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 64);

            // Fine concentric ring ringlets
            for (let x = 60; x < 490; x += 3) {
                if (Math.random() > 0.45) {
                    ctx.fillStyle = 'rgba(255,255,255,0.18)';
                    ctx.fillRect(x, 0, 1, 64);
                }
            }

            const tex = new THREE.CanvasTexture(canvas);
            return tex;
        }

        let scene, camera, renderer, starField;
        const bodyMeshes = [];
        let selectedIndex = 12; // Default to Saturn (index 12) matching user screenshot!
        let isCompareMode = false;
        let isPanMode = true; // Default: 1-finger drag pans across the screen so students can freely move around and compare!

        // Scale unit: 1 Three.js unit = 1,000 km
        const KM_TO_UNIT = 0.001;

        // Camera spherical coordinates relative to target
        const camState = {
            target: new THREE.Vector3(),
            currentTarget: new THREE.Vector3(),
            distance: 280,
            targetDistance: 280,
            theta: 0.25, // Horizontal angle (radians)
            targetTheta: 0.25,
            phi: 1.18,   // Vertical elevation (radians from top)
            targetPhi: 1.18
        };

        // Slider logarithmic mapping bounds (in Three.js units: 1 unit = 1,000km)
        const MIN_CAM_DIST = 2.0;          // ~2,000 km view (Charon closeup)
        const MAX_CAM_DIST = 2600000.0;    // ~2.6 billion km view (Red Supergiant full view)

        function initThreeScene() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf1f5f9);

            camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.05, 20000000);

            renderer = new THREE.WebGLRenderer({
                antialias: true,
                logarithmicDepthBuffer: true,
                powerPreference: 'high-performance'
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            // Cap pixelRatio at 1.5 for smooth 60fps on Galaxy Tab S6 Lite (2000x1200 display)
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
            container.appendChild(renderer.domElement);

            // Clean Studio Lighting Setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.78);
            scene.add(ambientLight);

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0xcbd5e1, 0.45);
            hemiLight.position.set(0, 1, 0);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
            dirLight.position.set(-1, 1.8, 1.4).normalize().multiplyScalar(5000000);
            scene.add(dirLight);

            // Background Starfield (visible when Dark Space Theme is toggled)
            createStarfield();

            // Build all 19 Celestial Bodies in a multi-scale nested cluster layout
            buildCelestialLineup();

            // Setup initial camera focused on Saturn & Jupiter + Earth cluster (matching screenshot!)
            focusOnBody(12, true);
        }

        function createStarfield() {
            const starGeo = new THREE.BufferGeometry();
            const count = 2500;
            const positions = new Float32Array(count * 3);
            for (let i = 0; i < count; i++) {
                const r = 8000000 + Math.random() * 6000000;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = Math.abs(r * Math.cos(phi)); // above horizon
                positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 3, sizeAttenuation: false });
            starField = new THREE.Points(starGeo, starMat);
            starField.visible = false;
            scene.add(starField);
        }

        function buildCelestialLineup() {
            // Exact nested cluster coordinates (in 1,000 km units) so smaller bodies always sit right in front of larger ones!
            // This guarantees you always see multiple planets/stars together in the same camera frame like the 12tune video.
            const CLUSTER_POSITIONS = [
                // 0~9: Moons, Dwarf Planets & Rocky Planets tightly clustered in the foreground
                { x: 0.0,    z: 98.0 }, // 0: Charon (R=0.6)
                { x: 2.3,    z: 98.2 }, // 1: Pluto (R=1.15)
                { x: 5.5,    z: 97.8 }, // 2: Eris (R=1.2)
                { x: 9.8,    z: 97.2 }, // 3: Moon (R=1.74)
                { x: 15.6,   z: 96.2 }, // 4: Mercury (R=2.44)
                { x: 22.8,   z: 95.0 }, // 5: Titan (R=2.58)
                { x: 30.2,   z: 93.6 }, // 6: Ganymede (R=2.63)
                { x: 38.8,   z: 91.8 }, // 7: Mars (R=3.40)
                { x: 52.0,   z: 88.5 }, // 8: Venus (R=6.05)
                { x: 68.5,   z: 85.0 }, // 9: Earth (R=6.38)

                // 10~11: Ice Giants right behind Earth & Venus
                { x: 112.0,  z: 62.0 }, // 10: Neptune (R=24.76)
                { x: 172.0,  z: 52.0 }, // 11: Uranus (R=25.56)

                // 12~13: Gas Giants framing the rocky & ice planets (matches screenshot composition!)
                { x: -75.0,  z: -10.0 }, // 12: Saturn (R=60.27, Ring R=139) -> left side
                { x: 135.0,  z: -15.0 }, // 13: Jupiter (R=71.49) -> right side, right behind Earth/Uranus

                // 14~15: Sun & Sirius looming directly behind Saturn & Jupiter
                { x: 420.0,  z: -780.0 }, // 14: Sun (R=696)
                { x: 2650.0, z: -1350.0 }, // 15: Sirius A (R=1252.8)

                // 16~18: Giant & Supergiant Stars nested at progressive cosmic scales
                { x: 58000.0,   z: -52000.0 },  // 16: Blue Giant (R=48,720)
                { x: 310000.0,  z: -195000.0 }, // 17: Red Giant (R=174,000)
                { x: 1280000.0, z: -760000.0 }  // 18: Red Supergiant (R=696,000)
            ];

            CELESTIAL_DATA.forEach((data, index) => {
                const radius = (data.diameterKm * KM_TO_UNIT) / 2;
                data.radiusUnits = radius;

                const pos = CLUSTER_POSITIONS[index];
                const group = new THREE.Group();
                group.position.set(pos.x, 0, pos.z);
                data.defaultPosition = group.position.clone();

                // Main Sphere (48x32 segments keeps spheres smooth while boosting tablet frame rate)
                const sphereGeo = new THREE.SphereGeometry(radius, 48, 32);
                const tex = createPlanetTexture(data.textureType);

                let sphereMat;
                if (data.isStar) {
                    sphereMat = new THREE.MeshBasicMaterial({
                        map: tex
                    });
                } else {
                    sphereMat = new THREE.MeshStandardMaterial({
                        map: tex,
                        roughness: 0.75,
                        metalness: 0.05
                    });
                }

                const sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
                sphereMesh.position.y = radius;
                sphereMesh.userData = { index };

                // Slight axial tilt for realism
                if (data.id === 'saturn') {
                    sphereMesh.rotation.z = THREE.MathUtils.degToRad(26.7);
                    sphereMesh.rotation.x = THREE.MathUtils.degToRad(10);
                } else if (data.id === 'jupiter' || data.id === 'earth') {
                    sphereMesh.rotation.z = THREE.MathUtils.degToRad(15);
                }

                group.add(sphereMesh);

                // Saturn's Iconic Rings
                if (data.hasRings) {
                    const innerR = radius * 1.22;
                    const outerR = radius * 2.32;
                    const ringGeo = new THREE.RingGeometry(innerR, outerR, 128);
                    // Map radial UVs for concentric ring texture
                    const pos = ringGeo.attributes.position;
                    const uvs = ringGeo.attributes.uv;
                    const v3 = new THREE.Vector3();
                    for (let i = 0; i < pos.count; i++) {
                        v3.fromBufferAttribute(pos, i);
                        const u = (v3.length() - innerR) / (outerR - innerR);
                        uvs.setXY(i, u, 0.5);
                    }
                    const ringMat = new THREE.MeshStandardMaterial({
                        map: createSaturnRingTexture(),
                        side: THREE.DoubleSide,
                        transparent: true,
                        roughness: 0.6
                    });
                    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                    ringMesh.rotation.x = Math.PI / 2;
                    sphereMesh.add(ringMesh);
                }

                scene.add(group);

                // Create Floating HTML Label Element for this celestial body (Sized for easy finger/S-Pen tap on 10.4" tablet)
                const labelEl = document.createElement('div');
                labelEl.className = 'absolute transform -translate-x-1/2 -translate-y-full pointer-events-auto cursor-pointer transition-opacity duration-150';
                labelEl.innerHTML = `
                    <div class="px-2.5 py-1 rounded-lg bg-slate-900/80 text-white backdrop-blur-sm shadow border border-white/20 flex items-center gap-1.5 whitespace-nowrap active:scale-95 hover:bg-blue-600 transition">
                        <span class="text-xs font-extrabold">${data.nameKo}</span>
                        <span class="text-[10px] font-mono-num opacity-80">${data.diameterKm.toLocaleString()}km</span>
                    </div>
                    <div class="w-px h-2 bg-slate-800/40 mx-auto"></div>
                `;
                labelEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (isCompareMode) {
                        exitCompareMode(false);
                    }
                    focusOnBody(index);
                    openSideTab(index);
                });
                document.getElementById('labels-container').appendChild(labelEl);

                bodyMeshes.push({
                    data,
                    group,
                    sphereMesh,
                    labelEl
                });
            });
        }

        function getGroupFramingForIndex(index) {
            const item = bodyMeshes[index];
            const r = item.data.radiusUnits;
            const pos = item.group.position;

            // Frame the clicked planet nicely with its surrounding neighbors
            if (index <= 3) {
                return {
                    target: new THREE.Vector3(pos.x, r, pos.z),
                    dist: Math.max(4.0, r * 5.2),
                    theta: 0.18,
                    phi: 1.22
                };
            } else if (index <= 9) {
                return {
                    target: new THREE.Vector3(pos.x, r, pos.z),
                    dist: r * 5.5,
                    theta: -0.12,
                    phi: 1.20
                };
            } else if (index === 10 || index === 11) {
                return {
                    target: new THREE.Vector3(pos.x, r, pos.z),
                    dist: r * 5.2,
                    theta: 0.12,
                    phi: 1.18
                };
            } else if (index === 12 || index === 13) {
                return {
                    target: new THREE.Vector3(pos.x, r * 0.9, pos.z),
                    dist: r * 4.8,
                    theta: 0.08,
                    phi: 1.16
                };
            } else if (index === 14) {
                return {
                    target: new THREE.Vector3(pos.x, r * 0.85, pos.z),
                    dist: r * 3.6,
                    theta: 0.15,
                    phi: 1.18
                };
            } else if (index === 15) {
                return {
                    target: new THREE.Vector3(pos.x, r * 0.85, pos.z),
                    dist: r * 3.8,
                    theta: 0.14,
                    phi: 1.18
                };
            } else {
                return {
                    target: new THREE.Vector3(pos.x, r * 0.85, pos.z),
                    dist: r * 3.5,
                    theta: 0.18,
                    phi: 1.18
                };
            }
        }

        function getAspectMultiplier() {
            const aspect = window.innerWidth / window.innerHeight;
            // On portrait orientation (e.g. 1200x2000), pull camera back slightly so horizontal planets aren't clipped
            return aspect < 1 ? (1 / Math.max(0.55, aspect)) * 0.85 : 1.0;
        }

        // Focus camera directly on the selected celestial body
        function focusOnBody(index, instant = false) {
            selectedIndex = Math.max(0, Math.min(CELESTIAL_DATA.length - 1, index));

            const framing = getGroupFramingForIndex(selectedIndex);
            camState.target.copy(framing.target);
            camState.targetDistance = framing.dist * getAspectMultiplier();
            camState.targetTheta = framing.theta;
            camState.targetPhi = framing.phi;

            if (instant) {
                camState.currentTarget.copy(camState.target);
                camState.distance = camState.targetDistance;
                camState.theta = camState.targetTheta;
                camState.phi = camState.targetPhi;
            }
        }

        function openSideTab(index) {
            selectedIndex = Math.max(0, Math.min(CELESTIAL_DATA.length - 1, index));
            const data = CELESTIAL_DATA[selectedIndex];

            document.getElementById('tab-category').textContent = data.categoryLabel;
            document.getElementById('tab-name-ko').textContent = data.nameKo;
            document.getElementById('tab-name-en').textContent = data.nameEn;
            document.getElementById('tab-diameter').textContent = `${data.diameterKm.toLocaleString()} km`;

            const earthRatio = data.diameterKm / EARTH_DIAMETER;
            document.getElementById('tab-earth-ratio').textContent = earthRatio >= 10
                ? `(지구의 약 ${Math.round(earthRatio).toLocaleString()}배)`
                : `(지구의 ${earthRatio.toFixed(1)}배)`;

            document.getElementById('tab-desc').textContent = data.desc;

            const sideTab = document.getElementById('side-info-tab');
            sideTab.classList.remove('hidden');

            // Sync comparison dropdown if not currently comparing
            if (!isCompareMode) {
                document.getElementById('select-compare-target').value = '';
                document.getElementById('compare-result-box').classList.add('hidden');
            }
        }

        function closeSideTab() {
            document.getElementById('side-info-tab').classList.add('hidden');
        }

        function setupTouchAndMouseControls() {
            const dom = renderer.domElement;
            let isDragging = false;
            let isSecondaryAction = false;
            let prevPointer = { x: 0, y: 0 };
            let pointerDownPos = { x: 0, y: 0 };
            let prevPinchDist = null;
            let prevTwoFingerMid = null;

            const raycaster = new THREE.Raycaster();
            const mouseVec = new THREE.Vector2();

            // Helper to pan camera target parallel to the current view plane
            function panCameraByScreenDelta(dx, dy) {
                const panScale = camState.distance * 0.0016;
                const cosT = Math.cos(camState.theta);
                const sinT = Math.sin(camState.theta);

                // Horizontal screen drag moves along camera's right vector (X-Z plane)
                camState.target.x -= dx * cosT * panScale;
                camState.target.z += dx * sinT * panScale;

                // Vertical screen drag moves camera target height (Y) and forward/back (Z/X)
                camState.target.y = Math.max(0, camState.target.y + dy * panScale * 0.65);
                camState.target.x -= dy * sinT * panScale * 0.65;
                camState.target.z -= dy * cosT * panScale * 0.65;
            }

            // Mouse Down
            dom.addEventListener('mousedown', (e) => {
                isDragging = true;
                isSecondaryAction = e.button === 2 || e.shiftKey;
                prevPointer = { x: e.clientX, y: e.clientY };
                pointerDownPos = { x: e.clientX, y: e.clientY };
            });

            // Mouse Move
            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - prevPointer.x;
                const dy = e.clientY - prevPointer.y;
                prevPointer = { x: e.clientX, y: e.clientY };

                const shouldPan = isPanMode ? !isSecondaryAction : isSecondaryAction;
                if (shouldPan) {
                    panCameraByScreenDelta(dx, dy);
                } else {
                    // Orbit camera
                    camState.targetTheta -= dx * 0.006;
                    camState.targetPhi = Math.max(0.15, Math.min(Math.PI / 2 - 0.04, camState.targetPhi - dy * 0.005));
                }
            });

            // Mouse Up & Click Raycast Selection
            window.addEventListener('mouseup', (e) => {
                if (!isDragging) return;
                isDragging = false;
                const moveDist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
                if (moveDist < 6 && e.button === 0) {
                    handleCanvasTap(e.clientX, e.clientY);
                }
            });

            dom.addEventListener('contextmenu', (e) => e.preventDefault());

            // Mouse Wheel Logarithmic Zoom (Pure zoom without snapping camera position)
            dom.addEventListener('wheel', (e) => {
                e.preventDefault();
                const zoomFactor = e.deltaY > 0 ? 1.16 : 0.86;
                applyZoomDistance(camState.targetDistance * zoomFactor);
            }, { passive: false });

            // Tablet Touch Start
            dom.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    isDragging = true;
                    prevPointer = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                    pointerDownPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                } else if (e.touches.length === 2) {
                    isDragging = false;
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    prevPinchDist = Math.hypot(dx, dy);
                    prevTwoFingerMid = {
                        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                        y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                    };
                }
            }, { passive: false });

            // Tablet Touch Move (1-finger free pan by default, 2-finger pinch zoom + pan)
            dom.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (e.touches.length === 1 && isDragging) {
                    const dx = e.touches[0].clientX - prevPointer.x;
                    const dy = e.touches[0].clientY - prevPointer.y;
                    prevPointer = { x: e.touches[0].clientX, y: e.touches[0].clientY };

                    if (isPanMode) {
                        panCameraByScreenDelta(dx, dy);
                    } else {
                        camState.targetTheta -= dx * 0.0065;
                        camState.targetPhi = Math.max(0.15, Math.min(Math.PI / 2 - 0.04, camState.targetPhi - dy * 0.0055));
                    }
                } else if (e.touches.length === 2 && prevPinchDist !== null) {
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const currDist = Math.hypot(dx, dy);

                    if (currDist > 10) {
                        const scaleRatio = prevPinchDist / currDist;
                        applyZoomDistance(camState.targetDistance * Math.pow(scaleRatio, 1.35));
                        prevPinchDist = currDist;
                    }

                    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                    if (prevTwoFingerMid) {
                        const panDx = midX - prevTwoFingerMid.x;
                        const panDy = midY - prevTwoFingerMid.y;
                        panCameraByScreenDelta(panDx, panDy);
                        prevTwoFingerMid.x = midX;
                        prevTwoFingerMid.y = midY;
                    }
                }
            }, { passive: false });

            dom.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) {
                    prevPinchDist = null;
                    prevTwoFingerMid = null;
                }
                if (e.touches.length === 0 && isDragging) {
                    isDragging = false;
                    const touch = e.changedTouches[0];
                    if (touch) {
                        const moveDist = Math.hypot(touch.clientX - pointerDownPos.x, touch.clientY - pointerDownPos.y);
                        // Increased tap tolerance (14px) for natural tablet finger & S-Pen touches
                        if (moveDist < 14) {
                            handleCanvasTap(touch.clientX, touch.clientY);
                        }
                    }
                }
            });

            function handleCanvasTap(clientX, clientY) {
                mouseVec.x = (clientX / window.innerWidth) * 2 - 1;
                mouseVec.y = -(clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouseVec, camera);

                const spheres = bodyMeshes.filter(b => b.group.visible).map(b => b.sphereMesh);
                const hits = raycaster.intersectObjects(spheres, false);
                if (hits.length > 0) {
                    const hitIndex = hits[0].object.userData.index;
                    if (hitIndex !== undefined) {
                        if (isCompareMode) {
                            // If tapping one of the two compared bodies, update tab to show its info
                            openSideTab(hitIndex);
                        } else {
                            // Focus on the tapped planet and open the side info tab
                            focusOnBody(hitIndex);
                            openSideTab(hitIndex);
                        }
                    }
                } else if (!isCompareMode) {
                    // Tapping empty background closes the side info tab to keep screen clean
                    closeSideTab();
                }
            }
        }

        function applyZoomDistance(newDist) {
            camState.targetDistance = Math.max(MIN_CAM_DIST, Math.min(MAX_CAM_DIST, newDist));
        }

        function setupUIControls() {
            const selectCompare = document.getElementById('select-compare-target');

            CELESTIAL_DATA.forEach((data, idx) => {
                const opt = new Option(`${data.nameKo} (${data.diameterKm.toLocaleString()} km)`, idx);
                selectCompare.add(opt);
            });

            // Close Side Tab button
            document.getElementById('btn-close-tab').addEventListener('click', () => {
                if (isCompareMode) {
                    exitCompareMode(true);
                }
                closeSideTab();
            });

            // Select another celestial body to compare side-by-side
            selectCompare.addEventListener('change', (e) => {
                const val = e.target.value;
                if (val === '') {
                    exitCompareMode(true);
                } else {
                    const targetIdx = parseInt(val, 10);
                    compareWithSelectedBody(selectedIndex, targetIdx);
                }
            });

            // Reset comparison back to full lineup
            document.getElementById('btn-reset-compare').addEventListener('click', () => {
                exitCompareMode(true);
            });
        }

        function compareWithSelectedBody(idxA, idxB) {
            isCompareMode = true;

            bodyMeshes.forEach((b, i) => {
                if (i === idxA || i === idxB) {
                    b.group.visible = true;
                } else {
                    b.group.visible = false;
                    b.labelEl.style.opacity = '0';
                    b.labelEl.style.pointerEvents = 'none';
                }
            });

            const meshA = bodyMeshes[idxA];
            const meshB = bodyMeshes[idxB];
            const rA = meshA.data.radiusUnits * (meshA.data.hasRings ? 2.1 : 1.0);
            const rB = meshB.data.radiusUnits * (meshB.data.hasRings ? 2.1 : 1.0);
            const maxR = Math.max(rA, rB);

            if (idxA === idxB) {
                meshA.group.position.set(0, 0, 0);
            } else {
                const separation = (rA + rB) * 0.72;
                meshA.group.position.set(-separation, 0, 0);
                meshB.group.position.set(separation, 0, 0);
            }

            // Aim camera midway between the two selected bodies (adjusted for portrait/landscape)
            camState.target.set(0, maxR * 0.8, 0);
            camState.targetDistance = Math.max(MIN_CAM_DIST, (rA + rB) * 2.5 * getAspectMultiplier());
            camState.targetTheta = 0;

            // Show comparison result inside the side tab
            const bigger = meshA.data.diameterKm >= meshB.data.diameterKm ? meshA.data : meshB.data;
            const smaller = meshA.data.diameterKm < meshB.data.diameterKm ? meshA.data : meshB.data;
            const linearRatio = bigger.diameterKm / smaller.diameterKm;
            const volumeRatio = Math.pow(linearRatio, 3);

            document.getElementById('compare-summary').textContent =
                `${bigger.nameKo}의 지름은 ${smaller.nameKo}의 약 ${linearRatio >= 100 ? Math.round(linearRatio).toLocaleString() : linearRatio.toFixed(1)}배입니다.`;

            document.getElementById('compare-volume').textContent =
                `부피 기준으로는 ${bigger.nameKo} 안에 ${smaller.nameKo}이(가) 약 ${volumeRatio >= 1000 ? Math.round(volumeRatio).toLocaleString() : volumeRatio.toFixed(1)}개 들어갑니다.`;

            document.getElementById('compare-result-box').classList.remove('hidden');
        }

        function exitCompareMode(refocus = true) {
            isCompareMode = false;
            document.getElementById('select-compare-target').value = '';
            document.getElementById('compare-result-box').classList.add('hidden');

            bodyMeshes.forEach((b) => {
                b.group.visible = true;
                b.group.position.copy(b.data.defaultPosition);
            });

            if (refocus) {
                focusOnBody(selectedIndex);
            }
        }

        function updateFloatingLabels() {
            const halfW = window.innerWidth / 2;
            const halfH = window.innerHeight / 2;
            const projVec = new THREE.Vector3();

            bodyMeshes.forEach((item, idx) => {
                if (!item.group.visible) {
                    item.labelEl.style.opacity = '0';
                    item.labelEl.style.pointerEvents = 'none';
                    return;
                }

                const r = item.data.radiusUnits;
                const distToCam = camera.position.distanceTo(item.group.position);
                const apparentRatio = r / distToCam;

                const isReasonableSize = (apparentRatio > 0.006 && apparentRatio < 1.6) || idx === selectedIndex || isCompareMode;

                if (!isReasonableSize) {
                    item.labelEl.style.opacity = '0';
                    item.labelEl.style.pointerEvents = 'none';
                    return;
                }

                projVec.set(
                    item.group.position.x,
                    r * 2.02,
                    item.group.position.z
                );
                projVec.project(camera);

                if (projVec.z < 1 && projVec.x >= -0.96 && projVec.x <= 0.96 && projVec.y >= -0.96 && projVec.y <= 0.96) {
                    const screenX = (projVec.x * halfW) + halfW;
                    const screenY = -(projVec.y * halfH) + halfH;

                    item.labelEl.style.transform = `translate(-50%, -100%) translate(${screenX}px, ${screenY}px)`;
                    item.labelEl.style.opacity = idx === selectedIndex ? '0.95' : '0.75';
                    item.labelEl.style.zIndex = idx === selectedIndex ? '15' : '5';
                    item.labelEl.style.pointerEvents = 'auto';
                } else {
                    item.labelEl.style.opacity = '0';
                    item.labelEl.style.pointerEvents = 'none';
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            // Smooth camera damping interpolation
            camState.currentTarget.lerp(camState.target, 0.08);
            camState.distance += (camState.targetDistance - camState.distance) * 0.08;
            camState.theta += (camState.targetTheta - camState.theta) * 0.12;
            camState.phi += (camState.targetPhi - camState.phi) * 0.12;

            // Convert spherical camera coords around currentTarget
            const sinPhi = Math.sin(camState.phi);
            const cosPhi = Math.cos(camState.phi);
            const sinTheta = Math.sin(camState.theta);
            const cosTheta = Math.cos(camState.theta);

            camera.position.set(
                camState.currentTarget.x + camState.distance * sinPhi * sinTheta,
                Math.max(0.2, camState.currentTarget.y + camState.distance * cosPhi),
                camState.currentTarget.z + camState.distance * sinPhi * cosTheta
            );
            camera.lookAt(camState.currentTarget);

            // Gentle axial rotation of all planets and stars
            bodyMeshes.forEach((b) => {
                if (b.group.visible) {
                    b.sphereMesh.rotation.y += 0.0025;
                }
            });

            updateFloatingLabels();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = function () {
            initThreeScene();
            setupTouchAndMouseControls();
            setupUIControls();
            animate();
        };
    </script>
</body>
</html>
